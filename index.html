<!DOCTYPE html>
<html lang="ka">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>HANDY Mini App</title>
  <!-- Telegram Web App SDK -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <!-- Supabase JS Client -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: #0f172a; color: #f8fafc; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
    
    .header { padding: 16px; background: #1e293b; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #334155; }
    .logo { font-size: 20px; font-weight: 800; color: #f97316; display: flex; align-items: center; gap: 6px; }
    .badge { font-size: 11px; padding: 4px 8px; background: #065f46; color: #34d399; border-radius: 12px; font-weight: 600; }
    
    .content { flex: 1; overflow-y: auto; padding: 16px; padding-bottom: 80px; }
    
    .radar-card { background: #1e293b; border-radius: 16px; padding: 20px; text-align: center; border: 1px solid #334155; margin-bottom: 20px; }
    .radar-circle { width: 120px; height: 120px; border-radius: 50%; background: radial-gradient(circle, rgba(16,185,129,0.2) 0%, rgba(15,23,42,1) 70%); border: 2px solid #10b981; margin: 0 auto 12px; display: flex; align-items: center; justify-content: center; font-size: 32px; font-weight: bold; color: #fff; position: relative; }
    .radar-location { font-size: 13px; color: #38bdf8; font-weight: 600; margin-bottom: 8px; }
    .radar-sub { font-size: 12px; color: #94a3b8; }
    
    .section-title { font-size: 16px; font-weight: 700; margin-bottom: 12px; display: flex; justify-content: space-between; }
    .job-card { background: #1e293b; border-radius: 12px; padding: 14px; margin-bottom: 10px; border: 1px solid #334155; }
    .job-title { font-size: 15px; font-weight: 700; color: #fff; margin-bottom: 6px; }
    .job-details { font-size: 12px; color: #94a3b8; display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
    .job-salary { color: #22c55e; font-weight: 700; font-size: 14px; }
    .btn-apply { width: 100%; padding: 8px; background: #334155; border: none; border-radius: 8px; color: #fff; font-weight: 600; font-size: 13px; }

    .form-group { margin-bottom: 12px; }
    .form-group label { display: block; font-size: 12px; color: #94a3b8; margin-bottom: 4px; }
    .form-group input { width: 100%; padding: 10px; background: #0f172a; border: 1px solid #334155; border-radius: 8px; color: #fff; font-size: 14px; }
    .btn-submit { width: 100%; padding: 12px; background: #f97316; border: none; border-radius: 8px; color: #fff; font-weight: bold; font-size: 15px; margin-top: 10px; }

    .nav-bar { position: fixed; bottom: 0; left: 0; right: 0; height: 65px; background: #1e293b; border-top: 1px solid #334155; display: flex; justify-content: space-around; align-items: center; }
    .nav-item { display: flex; flex-direction: column; align-items: center; gap: 4px; color: #64748b; font-size: 11px; text-decoration: none; cursor: pointer; }
    .nav-item.active { color: #f97316; }
  </style>
</head>
<body>

  <div class="header">
    <div class="logo">🟢 HANDY</div>
    <div class="badge">ავტორიზებული</div>
  </div>

  <div class="content" id="main-view">
    <div class="radar-card">
      <div class="radar-location">📍 ბათუმი / ცენტრი</div>
      <div class="radar-circle" id="job-count">0</div>
      <div class="radar-sub">აქტიური ვაკანსია შენგან 3 კმ-ში</div>
    </div>

    <div class="section-title">
      <span>ბოლო ვაკანსიები</span>
    </div>

    <div id="jobs-list">
      <div style="text-align: center; color: #64748b; padding: 20px;">იტვირთება...</div>
    </div>
  </div>

  <div class="content" id="post-view" style="display: none;">
    <div class="section-title">
      <span>ახალი ვაკანსიის დამატება</span>
    </div>
    
    <div class="form-group">
      <label>ვაკანსიის დასახელება</label>
      <input type="text" id="input-title" placeholder="მაგ: თონის მცხობელი">
    </div>
    <div class="form-group">
      <label>ანაზღაურება</label>
      <input type="text" id="input-salary" placeholder="მაგ: 90 ₾ / დღე">
    </div>
    <div class="form-group">
      <label>ლოკაცია</label>
      <input type="text" id="input-location" value="ბათუმი / ცენტრი">
    </div>

    <button class="btn-submit" onclick="submitJob()">გამოქვეყნება</button>
  </div>

  <div class="nav-bar">
    <div class="nav-item active" id="nav-main" onclick="switchTab('main')">
      <span>🏠</span>
      <span>მთავარი</span>
    </div>
    <div class="nav-item" id="nav-post" onclick="switchTab('post')">
      <span>➕</span>
      <span>დაპოსტვა</span>
    </div>
  </div>

  <script>
    // Telegram Web App-ის ინიციალიზაცია
    if (window.Telegram && window.Telegram.WebApp) {
      window.Telegram.WebApp.ready();
      window.Telegram.WebApp.expand();
    }

    const SUPABASE_URL = 'https://htaeixkajfshvzrubvkq.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_s10vpDCdrFlicjSe32FSyw_5QMCKjKx';
    
    // Supabase კლიენტის სწორი ინიციალიზაცია
    const supabaseClient = window.supabase ? window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY) : null;

    async function loadJobs() {
      const listEl = document.getElementById('jobs-list');
      const countEl = document.getElementById('job-count');

      if (!supabaseClient) {
        listEl.innerHTML = '<div style="color:#ef4444; text-align:center;">Supabase-თან კავშირი ვერ დამყარდა</div>';
        return;
      }

      try {
        const { data: jobs, error } = await supabaseClient
          .from('jobs')
          .select('*')
          .order('id', { ascending: false });

        if (error) {
          listEl.innerHTML = `<div style="color:#ef4444; text-align:center; padding:10px;">შეცდომა: ${error.message}</div>`;
          return;
        }

        countEl.innerText = jobs ? jobs.length : 0;

        if (!jobs || jobs.length === 0) {
          listEl.innerHTML = '<div style="text-align: center; color: #64748b; padding: 20px;">ვაკანსიები ჯერ არ არის</div>';
          return;
        }

        listEl.innerHTML = jobs.map(job => `
          <div class="job-card">
            <div class="job-title">${job.title || 'უდასახელო'}</div>
            <div class="job-details">
              <span>📍 ${job.location || 'ბათუმი'}</span>
              <span class="job-salary">${job.salary || '-'}</span>
            </div>
            <button class="btn-apply">გამოხმაურება</button>
          </div>
        `).join('');
      } catch (err) {
        listEl.innerHTML = `<div style="color:#ef4444; text-align:center; padding:10px;">ჩატვირთვის შეცდომა</div>`;
      }
    }

    async function submitJob() {
      const title = document.getElementById('input-title').value.trim();
      const salary = document.getElementById('input-salary').value.trim();
      const location = document.getElementById('input-location').value.trim();

      if (!title || !salary) {
        alert('გთხოვთ შეავსოთ სათაური და ანაზღაურება!');
        return;
      }

      if (!supabaseClient) {
        alert('Supabase კლიენტი მიუწვდომელია');
        return;
      }

      const { error } = await supabaseClient.from('jobs').insert([
        { title: title, salary: salary, location: location }
      ]);

      if (error) {
        alert('შეცდომა დაპოსტვისას: ' + error.message);
      } else {
        document.getElementById('input-title').value = '';
        document.getElementById('input-salary').value = '';
        switchTab('main');
        loadJobs();
      }
    }

    function switchTab(tab) {
      if (tab === 'main') {
        document.getElementById('main-view').style.display = 'block';
        document.getElementById('post-view').style.display = 'none';
        document.getElementById('nav-main').classList.add('active');
        document.getElementById('nav-post').classList.remove('active');
      } else {
        document.getElementById('main-view').style.display = 'none';
        document.getElementById('post-view').style.display = 'block';
        document.getElementById('nav-post').classList.add('active');
        document.getElementById('nav-main').classList.remove('active');
      }
    }

    document.addEventListener('DOMContentLoaded', () => {
      loadJobs();
    });
  </script>
</body>
</html>
