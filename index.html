<!DOCTYPE html>
<html lang="ka">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HANDY.GE - საქმე შენს უბანში</title>
    <!-- Google Fonts & FontAwesome Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Fira+GO:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Supabase JS Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            --accent-gradient: linear-gradient(135deg, #ff6b00 0%, #ff8800 100%);
            --glass-bg: rgba(30, 41, 59, 0.7);
            --glass-border: rgba(255, 255, 255, 0.1);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --card-hover: rgba(255, 255, 255, 0.05);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Fira GO', sans-serif;
        }

        body {
            background: var(--bg-gradient);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Header Navigation */
        header {
            width: 100%;
            max-width: 1200px;
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--glass-border);
            position: sticky;
            top: 0;
            z-index: 100;
            background: rgba(15, 23, 42, 0.8);
        }

        .logo {
            font-size: 1.6rem;
            font-weight: 700;
            background: var(--accent-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .post-btn {
            background: var(--accent-gradient);
            color: white;
            padding: 10px 20px;
            border-radius: 12px;
            border: none;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(255, 107, 0, 0.3);
            transition: all 0.3s ease;
        }

        .post-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(255, 107, 0, 0.5);
        }

        /* Hero Section */
        .hero {
            width: 100%;
            max-width: 1200px;
            padding: 60px 20px;
            text-align: center;
            background: radial-gradient(circle at center, rgba(255, 107, 0, 0.15) 0%, transparent 70%);
        }

        .hero h1 {
            font-size: 2.5rem;
            margin-bottom: 15px;
            font-weight: 700;
        }

        .hero p {
            color: var(--text-muted);
            font-size: 1.1rem;
            margin-bottom: 30px;
        }

        /* Search & Categories */
        .search-box {
            max-width: 600px;
            margin: 0 auto 30px auto;
            position: relative;
        }

        .search-box input {
            width: 100%;
            padding: 16px 20px 16px 50px;
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            color: white;
            font-size: 1rem;
            outline: none;
            backdrop-filter: blur(12px);
        }

        .search-box i {
            position: absolute;
            left: 20px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
        }

        .categories {
            display: flex;
            gap: 12px;
            justify-content: center;
            flex-wrap: wrap;
            margin-bottom: 40px;
        }

        .cat-chip {
            padding: 8px 16px;
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 0.9rem;
        }

        .cat-chip:hover, .cat-chip.active {
            background: var(--accent-gradient);
            border-color: transparent;
        }

        /* Vacancy Grid */
        .container {
            width: 100%;
            max-width: 1200px;
            padding: 0 20px 60px 20px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 20px;
        }

        .card {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            padding: 20px;
            backdrop-filter: blur(12px);
            transition: all 0.3s ease;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .card:hover {
            transform: translateY(-5px);
            border-color: rgba(255, 107, 0, 0.4);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 12px;
        }

        .card-title {
            font-size: 1.2rem;
            font-weight: 600;
        }

        .price-badge {
            background: rgba(255, 107, 0, 0.15);
            color: #ff8800;
            padding: 6px 12px;
            border-radius: 10px;
            font-weight: 700;
            border: 1px solid rgba(255, 107, 0, 0.3);
        }

        .card-desc {
            color: var(--text-muted);
            font-size: 0.95rem;
            margin-bottom: 20px;
            line-height: 1.5;
        }

        .card-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-top: 15px;
            border-top: 1px solid var(--glass-border);
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        /* Modal Form */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(8px);
            justify-content: center;
            align-items: center;
            z-index: 200;
        }

        .modal-content {
            background: #1e293b;
            border: 1px solid var(--glass-border);
            padding: 30px;
            border-radius: 20px;
            width: 90%;
            max-width: 500px;
            position: relative;
        }

        .close-btn {
            position: absolute;
            right: 20px;
            top: 20px;
            cursor: pointer;
            font-size: 1.2rem;
            color: var(--text-muted);
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 6px;
            font-size: 0.9rem;
            color: var(--text-muted);
        }

        .form-group input, .form-group textarea, .form-group select {
            width: 100%;
            padding: 12px;
            background: #0f172a;
            border: 1px solid var(--glass-border);
            border-radius: 10px;
            color: white;
            outline: none;
        }

        /* Footer */
        footer {
            width: 100%;
            background: rgba(15, 23, 42, 0.9);
            border-top: 1px solid var(--glass-border);
            padding: 40px 20px;
            margin-top: auto;
            text-align: center;
        }

        .footer-links {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .footer-links a {
            color: var(--text-muted);
            text-decoration: none;
            font-size: 0.9rem;
        }

        .footer-links a:hover {
            color: white;
        }
    </style>
</head>
<body>

    <!-- Header -->
    <header>
        <div class="logo"><i class="fa-solid fa-handshake"></i> HANDY.GE</div>
        <button class="post-btn" onclick="openModal()"><i class="fa-solid fa-plus"></i> განცხადების დამატება</button>
    </header>

    <!-- Hero Section -->
    <section class="hero">
        <h1>იპოვე სამუშაო ან ოსტატი შენს უბანში</h1>
        <p>მაღალი სანდოობის პლატფორმა კერძო შემსრულებლებისა და კომპანიებისთვის</p>

        <div class="search-box">
            <i class="fa-solid fa-magnifying-glass"></i>
            <input type="text" id="searchInput" placeholder="ძებნა: მიმტანი, ხელოსანი, ბათუმი..." onkeyup="filterCards()">
        </div>

        <div class="categories">
            <div class="cat-chip active" onclick="filterCategory('all')">ყველა</div>
            <div class="cat-chip" onclick="filterCategory('ხელოსანი')">🔧 ხელოსანი</div>
            <div class="cat-chip" onclick="filterCategory('მიმტანი')">🍽️ მიმტანი</div>
            <div class="cat-chip" onclick="filterCategory('დასუფთავება')">🧹 დასუფთავება</div>
            <div class="cat-chip" onclick="filterCategory('კურიერი')">🚚 კურიერი</div>
        </div>
    </section>

    <!-- Main Vacancies Grid -->
    <main class="container">
        <div class="grid" id="jobsGrid">
            <!-- Vacancy Cards Auto Generated Here -->
        </div>
    </main>

    <!-- Add Post Modal -->
    <div class="modal" id="postModal">
        <div class="modal-content">
            <i class="fa-solid fa-xmark close-btn" onclick="closeModal()"></i>
            <h2 style="margin-bottom: 20px;">ახალი ვაკანსიის დამატება</h2>
            <form id="jobForm" onsubmit="submitJob(event)">
                <div class="form-group">
                    <label>ვაკანსიის დასახელება</label>
                    <input type="text" id="title" placeholder="მაგ: მიმტანი, სანტექნიკი" required>
                </div>
                <div class="form-group">
                    <label>მდებარეობა / ქალაქი</label>
                    <input type="text" id="location" placeholder="მაგ: ბათუმი / ცენტრი" required>
                </div>
                <div class="form-group">
                    <label>ანაზღაურება (₾)</label>
                    <input type="number" id="price" placeholder="90" required>
                </div>
                <div class="form-group">
                    <label>დეტალური აღწერა</label>
                    <textarea id="description" rows="3" placeholder="სამუშაო საათები, პირობები..." required></textarea>
                </div>
                <div class="form-group">
                    <label>Telegram Username (@-ის გარეშე)</label>
                    <input type="text" id="telegram" placeholder="HandySupport" required>
                </div>
                <button type="submit" class="post-btn" style="width: 100%; margin-top: 10px;">გამოქვეყნება</button>
            </form>
        </div>
    </div>

    <!-- Footer -->
    <footer>
        <div class="footer-links">
            <a href="#">ჩვენ შესახებ</a>
            <a href="#">როგორ მუშაობს?</a>
            <a href="#">წესები და პირობები</a>
            <a href="#">კონტაქტი</a>
        </div>
        <p style="color: var(--text-muted); font-size: 0.85rem;">&copy; 2026 HANDY.GE. ყველა უფლება დაცულია.</p>
    </footer>

    <script>
        // Supabase Initialization
        const SUPABASE_URL = 'https://htaeixkajfshvzrubvkq.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_s10vpDCdrFlicjSe32FSyw_5QMCKjKx';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let allJobs = [];

        // Load Jobs from Supabase
        async function loadJobs() {
            try {
                const { data, error } = await supabaseClient
                    .from('jobs')
                    .select('*')
                    .order('created_at', { ascending: false });

                if (error) throw error;

                allJobs = data || [];
                renderJobs(allJobs);
            } catch (err) {
                console.error("Error loading jobs:", err);
                document.getElementById('jobsGrid').innerHTML = '<p style="text-align:center; grid-column: 1/-1; color: #ef4444;">მონაცემების ჩატვირთვა ვერ მოხერხდა</p>';
            }
        }

        // Render Cards
        function renderJobs(jobs) {
            const grid = document.getElementById('jobsGrid');
            if (jobs.length === 0) {
                grid.innerHTML = '<p style="text-align:center; grid-column: 1/-1; color: var(--text-muted);">ვაკანსიები ჯერ არ არის</p>';
                return;
            }

            grid.innerHTML = jobs.map(job => `
                <div class="card">
                    <div>
                        <div class="card-header">
                            <div class="card-title">${escapeHtml(job.title)}</div>
                            <div class="price-badge">${job.price} ₾</div>
                        </div>
                        <div class="card-desc">${escapeHtml(job.description)}</div>
                    </div>
                    <div class="card-footer">
                        <span><i class="fa-solid fa-location-dot"></i> ${escapeHtml(job.location)}</span>
                        <a href="https://t.me/${job.telegram}" target="_blank" style="color: #ff8800; text-decoration: none; font-weight: 600;">
                            <i class="fa-brands fa-telegram"></i> კონტაქტი
                        </a>
                    </div>
                </div>
            `).join('');
        }

        // Submit New Job
        async function submitJob(e) {
            e.preventDefault();
            const btn = e.target.querySelector('button');
            btn.disabled = true;
            btn.innerText = "ქვეყნდება...";

            const newJob = {
                title: document.getElementById('title').value,
                location: document.getElementById('location').value,
                price: parseFloat(document.getElementById('price').value),
                description: document.getElementById('description').value,
                telegram: document.getElementById('telegram').value.replace('@', '')
            };

            try {
                const { error } = await supabaseClient.from('jobs').insert([newJob]);
                if (error) throw error;

                closeModal();
                document.getElementById('jobForm').reset();
                loadJobs();
            } catch (err) {
                alert("შეცდომა დამატებისას: " + err.message);
            } finally {
                btn.disabled = false;
                btn.innerText = "გამოქვეყნება";
            }
        }

        // Filter Functionality
        function filterCards() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const filtered = allJobs.filter(job => 
                job.title.toLowerCase().includes(query) || 
                job.location.toLowerCase().includes(query) ||
                job.description.toLowerCase().includes(query)
            );
            renderJobs(filtered);
        }

        function filterCategory(cat) {
            document.querySelectorAll('.cat-chip').forEach(el => el.classList.remove('active'));
            event.target.classList.add('active');

            if (cat === 'all') {
                renderJobs(allJobs);
            } else {
                const filtered = allJobs.filter(job => job.title.toLowerCase().includes(cat.toLowerCase()));
                renderJobs(filtered);
            }
        }

        function openModal() { document.getElementById('postModal').style.display = 'flex'; }
        function closeModal() { document.getElementById('postModal').style.display = 'none'; }
        function escapeHtml(str) { return str ? str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;") : ''; }

        // Initial Load
        loadJobs();
    </script>
</body>
</html>
