<!DOCTYPE html>
<html lang="ka">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Handy.ge - სერვისები და რუკა (Dark Mode)</title>
    <style>
        :root {
            --bg: #0f172a;
            --card: #1e293b;
            --text: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #38bdf8;
            --accent-hover: #0ea5e9;
            --border: #334155;
            --radius: 12px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            line-height: 1.6;
        }

        header {
            background-color: var(--card);
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .navbar {
            max-width: 1200px;
            margin: 0 auto;
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: bold;
            color: var(--accent);
            text-decoration: none;
        }

        .btn {
            background-color: var(--accent);
            color: #0f172a;
            border: none;
            padding: 0.6rem 1.2rem;
            border-radius: var(--radius);
            cursor: pointer;
            font-weight: 700;
            transition: background-color 0.2s;
            text-decoration: none;
            display: inline-block;
        }

        .btn:hover {
            background-color: var(--accent-hover);
        }

        .btn-outline {
            background-color: transparent;
            color: var(--accent);
            border: 2px solid var(--accent);
        }

        .btn-outline:hover {
            background-color: var(--accent);
            color: #0f172a;
        }

        main {
            max-width: 1200px;
            margin: 2rem auto;
            padding: 0 1rem;
        }

        .hero {
            text-align: center;
            margin-bottom: 2rem;
        }

        .hero h1 {
            font-size: 2.2rem;
            margin-bottom: 0.5rem;
            color: var(--text);
        }

        .hero p {
            color: var(--text-muted);
            font-size: 1.1rem;
        }

        /* რუკის სექცია */
        .map-section {
            background: var(--card);
            padding: 1rem;
            border-radius: var(--radius);
            border: 1px solid var(--border);
            margin-bottom: 2rem;
            text-align: center;
        }

        .map-container {
            width: 100%;
            height: 220px;
            background: #090d16;
            border: 1px solid var(--border);
            border-radius: 8px;
            display: flex;
            justify-content: center;
            align-items: center;
            color: var(--text-muted);
            font-weight: bold;
        }

        /* ფილტრები */
        .search-filter-container {
            background: var(--card);
            padding: 1.5rem;
            border-radius: var(--radius);
            border: 1px solid var(--border);
            display: grid;
            grid-template-columns: 2fr 1.5fr 1fr auto;
            gap: 1rem;
            margin-bottom: 2rem;
        }

        @media (max-width: 768px) {
            .search-filter-container {
                grid-template-columns: 1fr;
            }
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 0.3rem;
        }

        .form-group label {
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-muted);
        }

        .form-control {
            padding: 0.75rem;
            border: 1px solid var(--border);
            background-color: #0f172a;
            color: var(--text);
            border-radius: var(--radius);
            font-size: 1rem;
            outline: none;
            transition: border-color 0.2s;
            width: 100%;
        }

        .form-control:focus {
            border-color: var(--accent);
        }

        /* ბადე და ბარათები */
        .listings-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 1.5rem;
        }

        .card {
            background: var(--card);
            border-radius: var(--radius);
            padding: 1.5rem;
            border: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            gap: 0.8rem;
            transition: transform 0.2s, border-color 0.2s;
            cursor: pointer;
        }

        .card:hover {
            transform: translateY(-3px);
            border-color: var(--accent);
        }

        .card-tag {
            align-self: flex-start;
            background-color: rgba(56, 189, 248, 0.1);
            color: var(--accent);
            font-size: 0.75rem;
            font-weight: 700;
            padding: 0.25rem 0.6rem;
            border-radius: 20px;
            text-transform: uppercase;
        }

        .card-title {
            font-size: 1.2rem;
            font-weight: bold;
            color: var(--text);
        }

        .card-desc {
            color: var(--text-muted);
            font-size: 0.95rem;
            flex-grow: 1;
        }

        .card-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 1rem;
            padding-top: 0.8rem;
            border-top: 1px solid var(--border);
            font-size: 0.9rem;
            color: var(--text-muted);
        }

        .card-price {
            font-weight: bold;
            color: var(--accent);
            font-size: 1.1rem;
        }

        /* მოდალური ფანჯრები */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.7);
            justify-content: center;
            align-items: center;
            z-index: 1000;
            padding: 1rem;
        }

        .modal-content {
            background: var(--card);
            border: 1px solid var(--border);
            padding: 2rem;
            border-radius: var(--radius);
            width: 100%;
            max-width: 500px;
            display: flex;
            flex-direction: column;
            gap: 1rem;
            max-height: 90vh;
            overflow-y: auto;
            color: var(--text);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .close-btn {
            background: none;
            border: none;
            font-size: 1.5rem;
            cursor: pointer;
            color: var(--text-muted);
        }

        .close-btn:hover {
            color: var(--text);
        }

        .detail-info {
            display: flex;
            flex-direction: column;
            gap: 0.8rem;
            margin-bottom: 1rem;
        }
    </style>
</head>
<body>

    <header>
        <div class="navbar">
            <a href="#" class="logo">Handy.ge 🌑</a>
            <button class="btn btn-outline" onclick="openAddModal()">განცხადების დამატება</button>
        </div>
    </header>

    <main>
        <section class="hero">
            <h1>იპოვე სასურველი სერვისი ან პროფესიონალი</h1>
            <p>მოძებნე რეგიონის, რუკისა და კატეგორიების მიხედვით</p>
        </section>

        <!-- რუკის სექცია -->
        <section class="map-section">
            <h3 style="margin-bottom: 0.5rem; font-size: 1.1rem; color: var(--text);">🗺️ საქართველოს ინტერაქტიული რუკა</h3>
            <div class="map-container">
                <span>რუკის ზონა (ფილტრაციისას იცვლება მდებარეობა)</span>
            </div>
        </section>

        <!-- ფილტრები -->
        <div class="search-filter-container">
            <div class="form-group">
                <label for="searchInput">ძებნა სათაურით</label>
                <input type="text" id="searchInput" class="form-control" placeholder="მაგ: ბუღალტერი, საიტი..." oninput="filterListings()">
            </div>
            
            <div class="form-group">
                <label for="categoryFilter">კატეგორია</label>
                <select id="categoryFilter" class="form-control" onchange="filterListings()">
                    <option value="">ყველა კატეგორია</option>
                    <option value="ადმინისტრაცია / მენეჯმენტი">ადმინისტრაცია / მენეჯმენტი</option>
                    <option value="ფინანსები / სტატისტიკა">ფინანსები / სტატისტიკა</option>
                    <option value="გაყიდვები">გაყიდვები</option>
                    <option value="PR / მარკეტინგი">PR / მარკეტინგი</option>
                    <option value="მშენებლობა / რემონტი">მშენებლობა / რემონტი</option>
                    <option value="IT / პროგრამირება">IT / პროგრამირება</option>
                    <option value="განათლება">განათლება</option>
                    <option value="სხვა">სხვა</option>
                </select>
            </div>

            <div class="form-group">
                <label for="locationFilter">რეგიონი</label>
                <select id="locationFilter" class="form-control" onchange="filterListings()">
                    <option value="">ნებისმიერ ადგილას</option>
                    <option value="თბილისი">თბილისი</option>
                    <option value="აჭარის ა/რ">აჭარის ა/რ</option>
                    <option value="იმერეთი">იმერეთი</option>
                    <option value="კახეთი">კახეთი</option>
                    <option value="დისტანციური">დისტანციური</option>
                </select>
            </div>

            <div class="form-group" style="justify-content: flex-end;">
                <button class="btn" onclick="resetFilters()" style="height: 46px;">გასუფთავება</button>
            </div>
        </div>

        <!-- განცხადებების ბადე -->
        <div class="listings-grid" id="listingsContainer"></div>
    </main>

    <!-- დამატების მოდალი -->
    <div class="modal" id="addModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>ახალი განცხადება</h2>
                <button class="close-btn" onclick="closeAddModal()">&times;</button>
            </div>
            <form onsubmit="addNewListing(event)">
                <div class="form-group" style="margin-bottom: 1rem;">
                    <label>სათაური</label>
                    <input type="text" id="newTitle" class="form-control" required placeholder="მაგ: მთავარი ბუღალტერი">
                </div>
                <div class="form-group" style="margin-bottom: 1rem;">
                    <label>კატეგორია</label>
                    <select id="newCategory" class="form-control" required>
                        <option value="ფინანსები / სტატისტიკა">ფინანსები / სტატისტიკა</option>
                        <option value="IT / პროგრამირება">IT / პროგრამირება</option>
                        <option value="მშენებლობა / რემონტი">მშენებლობა / რემონტი</option>
                        <option value="სხვა">სხვა</option>
                    </select>
                </div>
                <div class="form-group" style="margin-bottom: 1rem;">
                    <label>რეგიონი</label>
                    <select id="newLocation" class="form-control" required>
                        <option value="თბილისი">თბილისი</option>
                        <option value="აჭარის ა/რ">აჭარის ა/რ</option>
                        <option value="დისტანციური">დისტანციური</option>
                    </select>
                </div>
                <div class="form-group" style="margin-bottom: 1rem;">
                    <label>აღწერა</label>
                    <textarea id="newDesc" class="form-control" rows="3" required placeholder="დეტალური ინფორმაცია..."></textarea>
                </div>
                <div class="form-group" style="margin-bottom: 1rem;">
                    <label>საკონტაქტო</label>
                    <input type="text" id="newContact" class="form-control" required placeholder="599 00 00 00">
                </div>
                <div class="form-group" style="margin-bottom: 1.5rem;">
                    <label>ფასი</label>
                    <input type="text" id="newPrice" class="form-control" required placeholder="1200 ₾">
                </div>
                <button type="submit" class="btn" style="width: 100%;">დამატება</button>
            </form>
        </div>
    </div>

    <!-- დეტალების მოდალი -->
    <div class="modal" id="detailModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="detailTitle">სათაური</h2>
                <button class="close-btn" onclick="closeDetailModal()">&times;</button>
            </div>
            <div class="detail-info">
                <span id="detailTag" class="card-tag">კატეგორია</span>
                <p><strong>📍 რეგიონი:</strong> <span id="detailLocation"></span></p>
                <p><strong>💰 ფასი:</strong> <span id="detailPrice" style="color: var(--accent); font-weight: bold;"></span></p>
                <p><strong>📝 აღწერა:</strong></p>
                <p id="detailDesc" style="color: var(--text-muted); background: #090d16; padding: 0.8rem; border-radius: 8px; border: 1px solid var(--border);"></p>
            </div>
            <button class="btn" style="width: 100%;" onclick="alert('შეტყობინება გაიგზავნა!'); closeDetailModal();">გამოხმაურება</button>
        </div>
    </div>

    <script>
        let listings = [
            { id: 1, title: "მთავარი ბუღალტრის მომსახურება", category: "ფინანსები / სტატისტიკა", location: "თბილისი", desc: "სრული საბუღალტრო მომსახურება და დეკლარაციები.", contact: "599 11 22 33", price: "1200 ₾" },
            { id: 2, title: "ვებ-აპლიკაციების შემუშავება", category: "IT / პროგრამირება", location: "დისტანციური", desc: "თანამედროვე ვებსაიტების აწყობა ინდივიდუალური დაკვეთით.", contact: "dev@mail.ge", price: "შეთანხმებით" },
            { id: 3, title: "ბინების რემონტი", category: "მშენებლობა / რემონტი", location: "აჭარის ა/რ", desc: "სარემონტო სამუშაოები ხარისხის გარანტიით.", contact: "555 44 33 22", price: "შეთანხმებით" }
        ];

        function renderListings(items) {
            const container = document.getElementById('listingsContainer');
            container.innerHTML = '';
            if (items.length === 0) {
                container.innerHTML = `<p style="grid-column: 1/-1; text-align: center; color: var(--text-muted); padding: 2rem;">განცხადებები არ მოიძებნა.</p>`;
                return;
            }
            items.forEach(item => {
                const card = document.createElement('div');
                card.className = 'card';
                card.onclick = () => openDetailModal(item);
                card.innerHTML = `
                    <span class="card-tag">${item.category}</span>
                    <h3 class="card-title">${item.title}</h3>
                    <p class="card-desc">${item.desc}</p>
                    <div class="card-footer">
                        <span>📍 ${item.location}</span>
                        <span class="card-price">${item.price}</span>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function filterListings() {
            const searchText = document.getElementById('searchInput').value.toLowerCase();
            const cat = document.getElementById('categoryFilter').value;
            const loc = document.getElementById('locationFilter').value;

            const filtered = listings.filter(i => 
                (i.title.toLowerCase().includes(searchText) || i.desc.toLowerCase().includes(searchText)) &&
                (cat === "" || i.category === cat) &&
                (loc === "" || i.location === loc)
            );
            renderListings(filtered);
        }

        function resetFilters() {
            document.getElementById('searchInput').value = '';
            document.getElementById('categoryFilter').value = '';
            document.getElementById('locationFilter').value = '';
            renderListings(listings);
        }

        function openAddModal() { document.getElementById('addModal').style.display = 'flex'; }
        function closeAddModal() { document.getElementById('addModal').style.display = 'none'; }
        function openDetailModal(item) {
            document.getElementById('detailTitle').innerText = item.title;
            document.getElementById('detailTag').innerText = item.category;
            document.getElementById('detailLocation').innerText = item.location;
            document.getElementById('detailPrice').innerText = item.price;
            document.getElementById('detailDesc').innerText = item.desc + "\n\nსაკონტაქტო: " + item.contact;
            document.getElementById('detailModal').style.display = 'flex';
        }
        function closeDetailModal() { document.getElementById('detailModal').style.display = 'none'; }

        function addNewListing(e) {
            e.preventDefault();
            listings.unshift({
                id: Date.now(),
                title: document.getElementById('newTitle').value,
                category: document.getElementById('newCategory').value,
                location: document.getElementById('newLocation').value,
                desc: document.getElementById('newDesc').value,
                contact: document.getElementById('newContact').value,
                price: document.getElementById('newPrice').value
            });
            renderListings(listings);
            closeAddModal();
            e.target.reset();
        }

        renderListings(listings);
    </script>
</body>
</html>
