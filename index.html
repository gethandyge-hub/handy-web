<!DOCTYPE html>
<html lang="ka">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>HANDY v2.0</title>
  
  <script src="https://telegram.org/js/telegram-web-app.js?v=2.0"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    :root {
      --bg-color: #0d131f;
      --card-bg: #1a2332;
      --text-color: #f8fafc;
      --subtext-color: #94a3b8;
      --primary-color: #f97316;
      --accent-green: #10b981;
      --border-radius: 16px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      padding-bottom: 80px;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px;
      background-color: var(--card-bg);
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 800;
      font-size: 1.2rem;
      color: var(--primary-color);
    }

    .badge-status {
      background: rgba(16, 185, 129, 0.2);
      color: var(--accent-green);
      font-size: 0.75rem;
      padding: 4px 10px;
      border-radius: 20px;
      font-weight: 600;
    }

    .container {
      padding: 16px;
    }

    .stats-card {
      background: var(--card-bg);
      border-radius: var(--border-radius);
      padding: 20px;
      text-align: center;
      margin-bottom: 24px;
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    .location-tag {
      color: #60a5fa;
      font-size: 0.85rem;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .counter-circle {
      width: 90px;
      height: 90px;
      border-radius: 50%;
      border: 3px solid var(--accent-green);
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 12px;
      font-size: 2.2rem;
      font-weight: bold;
      color: #fff;
    }

    .section-title {
      font-size: 1.1rem;
      font-weight: 700;
      margin-bottom: 12px;
    }

    .job-card {
      background: var(--card-bg);
      border-radius: var(--border-radius);
      padding: 16px;
      margin-bottom: 12px;
      border: 1px solid rgba(255, 255, 255, 0.05);
      cursor: pointer;
    }

    .job-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 8px;
    }

    .job-title {
      font-size: 1.05rem;
      font-weight: 700;
    }

    .job-price {
      color: var(--accent-green);
      font-weight: 800;
      font-size: 1.1rem;
    }

    .job-location {
      color: var(--subtext-color);
      font-size: 0.8rem;
      margin-bottom: 12px;
    }

    .btn-apply {
      width: 100%;
      background: var(--primary-color);
      color: white;
      border: none;
      padding: 10px;
      border-radius: 10px;
      font-weight: 600;
      cursor: pointer;
    }

    .nav-bar {
      position: fixed;
      bottom: 0;
      left: 0; right: 0;
      background: var(--card-bg);
      display: flex;
      justify-content: space-around;
      padding: 12px 0;
      border-top: 1px solid rgba(255,255,255,0.08);
    }

    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      color: var(--subtext-color);
      font-size: 0.75rem;
      background: none;
      border: none;
      cursor: pointer;
    }

    .nav-item.active {
      color: var(--primary-color);
    }

    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.85);
      z-index: 1000;
      align-items: flex-end;
    }

    .modal.active {
      display: flex;
    }

    .modal-content {
      background: var(--card-bg);
      width: 100%;
      border-radius: 24px 24px 0 0;
      padding: 24px;
      max-height: 85vh;
      overflow-y: auto;
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }

    .close-btn {
      background: none;
      border: none;
      color: var(--subtext-color);
      font-size: 1.5rem;
      cursor: pointer;
    }

    .form-group {
      margin-bottom: 14px;
    }

    .form-group label {
      display: block;
      font-size: 0.85rem;
      color: var(--subtext-color);
      margin-bottom: 6px;
    }

    .form-group input, .form-group textarea {
      width: 100%;
      padding: 12px;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 10px;
      color: white;
      font-size: 0.95rem;
    }

    .btn-submit {
      width: 100%;
      background: var(--primary-color);
      color: white;
      border: none;
      padding: 14px;
      border-radius: 12px;
      font-weight: bold;
      font-size: 1rem;
      margin-top: 10px;
      cursor: pointer;
      text-align: center;
      text-decoration: none;
      display: block;
    }
  </style>
</head>
<body>

  <header>
    <div class="logo">
      <i class="fa-solid fa-handshake"></i> HANDY <span style="font-size: 10px; color: #94a3b8;">v2</span>
    </div>
    <div class="badge-status">ავტორიზებული</div>
  </header>

  <div class="container">
    <div class="stats-card">
      <div class="location-tag">
        <i class="fa-solid fa-location-dot"></i> ბათუმი / ცენტრი
      </div>
      <div class="counter-circle" id="job-count">0</div>
      <div class="stats-subtext">აქტიური ვაკანსია შენგან 3 კმ-ში</div>
    </div>

    <div class="section-title">ბოლო ვაკანსიები</div>
    <div id="job-list"></div>
  </div>

  <div class="nav-bar">
    <button class="nav-item active" onclick="switchTab('home')">
      <i class="fa-solid fa-house" style="font-size: 1.2rem;"></i>
      <span>მთავარი</span>
    </button>
    <button class="nav-item" onclick="openCreateModal()">
      <i class="fa-solid fa-plus-circle" style="font-size: 1.2rem; color: var(--primary-color);"></i>
      <span style="color: var(--primary-color); font-weight: bold;">დაპოსტვა</span>
    </button>
  </div>

  <div id="modal-details" class="modal">
    <div class="modal-content">
      <div class="modal-header">
        <h3 id="modal-title">ვაკანსია</h3>
        <button class="close-btn" onclick="closeModal('modal-details')">&times;</button>
      </div>
      <p id="modal-location" style="color: var(--subtext-color); margin-bottom: 10px;"></p>
      <h2 id="modal-price" style="color: var(--accent-green); margin-bottom: 16px;"></h2>
      <p id="modal-desc" style="line-height: 1.5; margin-bottom: 20px;"></p>
      <a id="btn-contact" href="#" target="_blank" class="btn-submit">
        <i class="fa-brands fa-telegram"></i> დამსაქმებელთან დაკავშირება
      </a>
    </div>
  </div>

  <div id="modal-create" class="modal">
    <div class="modal-content">
      <div class="modal-header">
        <h3>ახალი ვაკანსიის დამატება</h3>
        <button class="close-btn" onclick="closeModal('modal-create')">&times;</button>
      </div>
      <form id="create-job-form">
        <div class="form-group">
          <label>ვაკანსიის დასახელება</label>
          <input type="text" id="input-title" placeholder="მაგ: მიმტანი" required>
        </div>
        <div class="form-group">
          <label>მდებარეობა / ქალაქი</label>
          <input type="text" id="input-location" value="ბათუმი / ცენტრი" required>
        </div>
        <div class="form-group">
          <label>ანაზღაურება (₾)</label>
          <input type="number" id="input-price" placeholder="90" required>
        </div>
        <div class="form-group">
          <label>დეტალური აღწერა</label>
          <textarea id="input-desc" rows="3" placeholder="სამუშაო საათები, მოთხოვნები..."></textarea>
        </div>
        <div class="form-group">
          <label>შენი Telegram Username (@-ის გარეშე)</label>
          <input type="text" id="input-contact" placeholder="username" required>
        </div>
        <button type="submit" class="btn-submit">გამოქვეყნება</button>
      </form>
    </div>
  </div>

  <script>
    const tg = window.Telegram?.WebApp;
    if (tg) {
      tg.ready();
      tg.expand();
    }

    const SUPABASE_URL = "https://YOUR_SUPABASE_PROJECT.supabase.co"; 
    const SUPABASE_KEY = "YOUR_SUPABASE_ANON_KEY";
    const supabaseClient = window.supabase ? window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY) : null;

    function triggerHaptic() {
      if (tg && tg.HapticFeedback) {
        tg.HapticFeedback.impactOccurred('medium');
      }
    }

    function openModal(id) {
      triggerHaptic();
      document.getElementById(id).classList.add('active');
    }

    function closeModal(id) {
      triggerHaptic();
      document.getElementById(id).classList.remove('active');
    }

    function openCreateModal() {
      openModal('modal-create');
    }

    function switchTab(tab) {
      triggerHaptic();
    }

    async function loadJobs() {
      const container = document.getElementById('job-list');
      const countEl = document.getElementById('job-count');

      if (!supabaseClient) {
        countEl.innerText = "2";
        container.innerHTML = `
          <div class="job-card" onclick="showDetails('მიმტანი', 'ბათუმი / ცენტრი', '100', 'საჭიროა გამოცდილი მიმტანი.', 'https://t.me/username')">
            <div class="job-header">
              <div class="job-title">მიმტანი</div>
              <div class="job-price">100 ₾</div>
            </div>
            <div class="job-location"><i class="fa-solid fa-location-dot"></i> ბათუმი / ცენტრი</div>
            <button class="btn-apply">დეტალურად / გამოხმაურება</button>
          </div>
          <div class="job-card" onclick="showDetails('მიმტანი', 'ბათუმი / ცენტრი', '90', 'საღამოს ცვლა.', 'https://t.me/username')">
            <div class="job-header">
              <div class="job-title">მიმტანი</div>
              <div class="job-price">90 ₾</div>
            </div>
            <div class="job-location"><i class="fa-solid fa-location-dot"></i> ბათუმი / ცენტრი</div>
            <button class="btn-apply">დეტალურად / გამოხმაურება</button>
          </div>
        `;
        return;
      }

      const { data: jobs, error } = await supabaseClient.from('jobs').select('*').order('created_at', { ascending: false });

      if (error || !jobs || jobs.length === 0) {
        countEl.innerText = "0";
        container.innerHTML = `<p style="text-align: center; color: var(--subtext-color); margin-top: 20px;">ვაკანსიები ჯერ არ არის</p>`;
        return;
      }

      countEl.innerText = jobs.length;
      container.innerHTML = jobs.map(job => `
        <div class="job-card" onclick="showDetails('${job.title}', '${job.location}', '${job.price}', '${job.description || ''}', '${job.contact}')">
          <div class="job-header">
            <div class="job-title">${job.title}</div>
            <div class="job-price">${job.price} ₾</div>
          </div>
          <div class="job-location"><i class="fa-solid fa-location-dot"></i> ${job.location}</div>
          <button class="btn-apply">დეტალურად / გამოხმაურება</button>
        </div>
      `).join('');
    }

    function showDetails(title, location, price, desc, contact) {
      triggerHaptic();
      document.getElementById('modal-title').innerText = title;
      document.getElementById('modal-location').innerText = location;
      document.getElementById('modal-price').innerText = price + ' ₾';
      document.getElementById('modal-desc').innerText = desc || 'დამატებითი აღწერა არ არის.';
      
      const cleanContact = contact ? contact.replace('@', '') : '';
      document.getElementById('btn-contact').href = `https://t.me/${cleanContact}`;
      
      openModal('modal-details');
    }

    document.getElementById('create-job-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      triggerHaptic();

      const title = document.getElementById('input-title').value;
      const location = document.getElementById('input-location').value;
      const price = document.getElementById('input-price').value;
      const description = document.getElementById('input-desc').value;
      const contact = document.getElementById('input-contact').value;

      if (supabaseClient) {
        const { error } = await supabaseClient.from('jobs').insert([
          { title, location, price, description, contact }
        ]);

        if (error) {
          alert("შეცდომა დამატებისას: " + error.message);
          return;
        }
      }

      alert("ვაკანსია წარმატებით დაემატა!");
      closeModal('modal-create');
      document.getElementById('create-job-form').reset();
      loadJobs();
    });

    loadJobs();
  </script>
</body>
</html>
<!-- v2 update -->
